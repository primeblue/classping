<body style="margin:0">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--surface2:#E9EDF1;--ink:#17212B;--ink2:#5A6B7B;--line:#D5DCE3;
  --accent:#0F8B8D;--accent-ink:#FFFFFF;--good:#2E9E6B;--mid:#E0A526;--bad:#D65A4A;--vote-yes:#0F8B8D;--vote-no:#D65A4A;--vote-ab:#8A99A8;
  --stage:#0E1A26;--stage-ink:#F4F7FA;--stage-dim:#9FB3C6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B;--surface:#18212B;--surface2:#212C38;--ink:#EEF2F6;--ink2:#9DACBB;--line:#2C3947;--accent:#3DB7B9;--accent-ink:#0B1418;
}}
:root[data-theme="dark"]{
  --bg:#0F151B;--surface:#18212B;--surface2:#212C38;--ink:#EEF2F6;--ink2:#9DACBB;--line:#2C3947;--accent:#3DB7B9;--accent-ink:#0B1418;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3,.num{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;min-width:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{color:var(--bad)}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:20px;letter-spacing:-.01em}
.brand small{color:var(--ink2)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);letter-spacing:.02em;align-self:center}
.tag.live{background:var(--good);color:#fff}
.tag.demo{background:var(--mid);color:#1a1a1a}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:0 0 6px}
.small{font-size:12px;color:var(--ink2)}
.err{color:var(--bad);font-size:13px;margin:6px 0 0;min-height:1em}
/* host layout */
.host{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.host{grid-template-columns:1fr}.stage{position:static!important;height:auto!important;min-height:520px}.panel{max-height:none!important}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 80px);overflow:auto;position:sticky;top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tools button{display:flex;align-items:center;gap:8px;justify-content:flex-start;text-align:left}
.tools button .k{font-family:"IBM Plex Sans KR";font-size:11px;color:var(--ink2);margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tools button.active .k{color:var(--bg);border-color:var(--bg)}
.joinbox .code{font-family:"IBM Plex Sans KR";font-size:34px;font-weight:700;letter-spacing:.12em;line-height:1}
.vol{display:flex;gap:8px;align-items:center;white-space:nowrap}
.vol input{padding:0}
/* stage */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:14px;height:calc(100vh - 80px);min-height:480px;position:sticky;top:12px;overflow:hidden;display:flex;flex-direction:column;overflow-wrap:anywhere}
.stage a{color:#7FD8DA}
.stage-head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font-size:17px;color:var(--stage-dim);border-bottom:1px solid rgba(255,255,255,.08);gap:12px;flex-wrap:wrap}
.stage-head b{color:var(--stage-ink)}
.stage-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px;min-height:0}
.stage-q{font-size:clamp(24px,3vw,36px);font-weight:600;margin:0;max-width:24ch;line-height:1.3}
.stage-big{font-size:clamp(40px,7vw,96px);font-weight:700;margin:0;line-height:1.05}
.bars{display:flex;gap:20px;align-items:flex-end;height:min(300px,40vh);width:min(620px,100%)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar .fill{width:100%;border-radius:10px 10px 4px 4px;transition:height .5s cubic-bezier(.2,.8,.2,1);min-height:4px}
.bar .n{font-size:34px;font-weight:700;line-height:1}
.bar .n small{font-size:20px;color:var(--stage-dim);font-weight:500}
.bar .t{font-size:21px;color:var(--stage-ink)}
.cloud{position:relative;width:min(820px,100%);flex:1;min-height:240px;max-height:420px}
.cloud span{position:absolute;white-space:nowrap;font-weight:600;transform:translate(-50%,-50%);transition:all .6s;font-family:"IBM Plex Sans KR"}
.notice-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:32px 40px;max-width:760px;width:100%}
.notice-card p{white-space:pre-wrap;font-size:clamp(18px,2vw,26px);margin:0;text-align:left;line-height:1.6}
.idle-code{font-family:"IBM Plex Sans KR";font-size:clamp(64px,10vw,140px);font-weight:700;letter-spacing:.14em;line-height:1;margin:0}
.idle-qr{background:#fff;padding:10px;border-radius:12px;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.idle-qr img,.idle-qr canvas{width:200px!important;height:200px!important}
.idle-row{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}
.hidden-results{font-size:22px;color:var(--stage-dim)}
/* board */
.board{position:absolute;inset:0;display:none;flex-direction:column;background:#1B2430;z-index:5}
.board.on{display:flex}
.bbar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#0B1219;border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap;font-size:13px}
.bbar .sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 2px}
.bbar button{min-width:0;padding:4px 8px;font-size:13px;background:transparent;color:#E6EDF5;border-color:transparent;border-radius:6px}
.bbar button:hover{background:rgba(255,255,255,.1);border-color:transparent}
.bbar button.active{background:#3DB7B9;color:#0B1418;border-color:#3DB7B9}
.bbar .sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent}
.bbar .sw.active{border-color:#fff;background:inherit}
.bbar input[type=range]{width:70px;padding:0}
.bbar .pg{font-family:"IBM Plex Sans KR";font-variant-numeric:tabular-nums;color:#E6EDF5;min-width:56px;text-align:center}
.bbar .menu{position:relative}
.bbar .menu > div{display:none;position:absolute;top:100%;left:0;background:#18212B;border:1px solid #2C3947;border-radius:8px;padding:6px;z-index:9;min-width:200px;flex-direction:column;gap:2px}
.bbar .menu:hover > div,.bbar .menu:focus-within > div{display:flex}
.bbar .menu > div button{text-align:left;width:100%}
.bwrap{flex:1;position:relative;overflow:hidden;touch-action:none}
.bwrap canvas{position:absolute;left:0;top:0}
#bInk{cursor:crosshair}
#bInk.eraser{cursor:cell}#bInk.text{cursor:text}#bInk.laser{cursor:none}
.laser{position:absolute;width:14px;height:14px;border-radius:50%;background:#FF2D55;box-shadow:0 0 12px 4px rgba(255,45,85,.6);transform:translate(-50%,-50%);pointer-events:none;display:none}
.bhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#9FB3C6;text-align:center;font-size:16px;pointer-events:none;width:80%}
.stage:fullscreen{border-radius:0;height:100vh!important}
.stage-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:15px;color:var(--stage-dim);gap:12px;flex-wrap:wrap}
.stage-foot b{color:var(--stage-ink)}
/* student */
.stu{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stu .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;overflow-wrap:anywhere}
.stu .q{font-size:20px;font-weight:600;margin:0 0 16px}
.choice{display:grid;gap:10px}
.choice button{padding:18px;font-size:18px;font-weight:600;border-width:2px;border-radius:12px;position:relative}
.choice button[data-v="1"],.choice button[data-v="yes"]{border-color:var(--good)}
.choice button[data-v="2"],.choice button[data-v="abstain"]{border-color:var(--mid)}
.choice button[data-v="3"],.choice button[data-v="no"]{border-color:var(--bad)}
.choice button.sent{background:var(--ink);color:var(--bg)}
.choice button.sent::after{content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px}
.status{margin:12px 0 0;font-size:13px;color:var(--ink2);text-align:center;min-height:1.2em}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-size:14px;text-align:center;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips span{background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:13px}
.center{text-align:center;color:var(--ink2)}
.landing{max-width:760px;margin:40px auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.landing{grid-template-columns:1fr}}
.landing .panel{gap:10px;position:static;max-height:none}
.landing h2{margin:0;font-size:18px}
.landing p{margin:0;color:var(--ink2);font-size:14px}
.row{display:flex;gap:8px}
.hidden{display:none!important}
.tl{font-family:"IBM Plex Sans KR";font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><h1>ClassPing</h1><small>강의 인터랙션 리모컨</small></div>
    <div class="row" id="statusRow"><span class="tag" id="connTag">연결 중…</span><a id="switchLink" class="small" href="#" style="align-self:center"></a></div>
  </div>

  <section id="viewLanding" class="landing hidden">
    <div class="panel">
      <h2>강사로 시작</h2>
      <p>세션 코드가 만들어지고, 화면공유용 무대(스테이지)와 조작 패널이 열립니다.</p>
      <button class="primary" id="btnHost">강사 화면 열기</button>
    </div>
    <div class="panel">
      <h2>학생으로 참여</h2>
      <p>강사가 화면에 띄운 4자리 코드를 입력하세요.</p>
      <div class="row"><input id="joinCode" aria-label="참여 코드" maxlength="4" placeholder="예: K7PX" autocapitalize="characters" autocomplete="off" spellcheck="false" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px"><button class="primary" id="btnJoin" style="min-width:80px">참여</button></div>
      <p class="err" id="joinErr" aria-live="polite"></p>
    </div>
  </section>

  <section id="viewHost" class="host hidden">
    <aside class="panel">
      <div class="joinbox">
        <p class="lbl">참여 코드</p>
        <div class="code num" id="codeText">----</div>
        <div class="row" style="margin-top:8px"><button id="btnCopy" style="flex:1">🔗 참여 링크 복사</button><button id="btnEnd" class="danger" title="세션 종료 후 새 코드">종료</button></div>
      </div>
      <div class="tools">
        <p class="lbl">피드백</p>
        <div style="display:grid;gap:6px">
          <button data-mode="understand">🙋 이해도 체크<span class="k">1</span></button>
          <button data-mode="vote">⚖️ 찬성 / 반대<span class="k">2</span></button>
          <button data-mode="cloud">☁️ 워드 클라우드<span class="k">3</span></button>
          <button id="btnReveal">👁 결과 숨기기<span class="k">R</span></button>
        </div>
        <p class="lbl" style="margin-top:12px">질문 / 안내 문구 <span id="qTextMode" style="text-transform:none;letter-spacing:0"></span></p>
        <textarea id="qText" rows="3" aria-label="질문 또는 안내 문구"></textarea>
        <button id="btnApplyText" style="margin-top:6px">문구 반영</button>
      </div>
      <div class="tools">
        <p class="lbl">운영</p>
        <div style="display:grid;gap:6px">
          <button data-mode="break">☕ 쉬는 시간<span class="k">4</span></button>
          <div class="grid3"><button data-min="5">5분</button><button data-min="10" class="active">10분</button><button data-min="15">15분</button></div>
          <button data-mode="lab">🧪 실습 안내<span class="k">5</span></button>
          <button data-mode="notice">📣 공지<span class="k">6</span></button>
          <button data-mode="idle">⏸ 대기 화면 (코드·QR)<span class="k">0</span></button>
        </div>
      </div>
      <div class="tools">
        <p class="lbl">화면 도구</p>
        <div class="grid2">
          <button id="btnBoard">🖊 보드 (PDF·칠판)<span class="k">B</span></button>
          <button id="btnFull">⛶ 전체화면<span class="k">F</span></button>
        </div>
        <button id="btnBgm" style="display:flex;align-items:center;gap:8px;margin-top:6px;width:100%">🎵 BGM 켜기/끄기<span class="k">M</span></button>
        <p class="lbl" style="margin-top:8px">BGM 분위기 (BGM이 켜져 있을 때 적용)</p>
        <div class="grid3" id="bgmPresets">
          <button data-bgm="focus" class="active">집중</button><button data-bgm="rest">휴식</button><button data-bgm="lab">실습</button>
        </div>
        <label class="small vol" style="margin-top:6px">볼륨 <input type="range" id="vol" aria-label="BGM 볼륨" min="0" max="1" step=".05" value=".35"></label>
      </div>
      <button id="btnReset" class="danger small">응답 초기화 (새 라운드)</button>
    </aside>

    <div class="stage" id="stage">
      <div class="stage-head"><span id="stageMode">대기</span><span>코드 <b class="num" id="codeText2">----</b> · 참여 <b class="num" id="members">0</b>명</span></div>
      <div class="stage-body" id="stageBody"></div>
      <div class="board" id="board">
        <div class="bbar">
          <div class="menu"><button>📄 파일 ▾</button><div>
            <button id="bOpenPdf">PDF 열기…</button>
            <button id="bOpenImg">이미지(PNG/JPG) 열기…</button>
            <button id="bOpenProj">판서 프로젝트(.json) 열기…</button>
            <span class="sep" style="width:100%;height:1px;margin:4px 0"></span>
            <button id="bSavePng">현재 페이지 PNG 저장</button>
            <button id="bSaveZip">전체 페이지 PNG (ZIP)</button>
            <button id="bSaveProj">판서 프로젝트(.json) 저장</button>
            <span class="sep" style="width:100%;height:1px;margin:4px 0"></span>
            <button id="bNew" style="color:#F7A072">모두 지우고 새로 시작</button>
          </div></div>
          <div class="menu"><button>➕ 페이지 ▾</button><div>
            <button data-bg="green">🟩 녹색 칠판</button><button data-bg="black">⬛ 검은 보드</button><button data-bg="white">⬜ 흰 보드</button><button data-bg="grid">▦ 격자</button>
            <span class="sep" style="width:100%;height:1px;margin:4px 0"></span>
            <button id="bDelPage" style="color:#F7A072">현재 페이지 삭제</button>
          </div></div>
          <span class="sep"></span>
          <button id="bPrev" title="이전 페이지 (←)">◀</button><span class="pg" id="bPg">0 / 0</span><button id="bNext" title="다음 페이지 (→)">▶</button>
          <span class="sep"></span>
          <button data-tool="pen" class="active" title="펜">✏️ 펜</button>
          <button data-tool="hl" title="형광펜">🖍 형광</button>
          <button data-tool="line" title="직선">╲ 선</button>
          <button data-tool="rect" title="사각형">▭</button>
          <button data-tool="ellipse" title="원">◯</button>
          <button data-tool="text" title="텍스트">A 글자</button>
          <button data-tool="eraser" title="지우개 (선 단위)">⌫ 지우개</button>
          <button data-tool="laser" title="레이저 포인터">🔴</button>
          <span class="sep"></span>
          <button class="sw active" data-c="#FFD166" style="background:#FFD166" title="노랑"></button>
          <button class="sw" data-c="#FFFFFF" style="background:#FFFFFF" title="흰색"></button>
          <button class="sw" data-c="#4CC9F0" style="background:#4CC9F0" title="하늘"></button>
          <button class="sw" data-c="#80ED99" style="background:#80ED99" title="연두"></button>
          <button class="sw" data-c="#F72585" style="background:#F72585" title="핑크"></button>
          <button class="sw" data-c="#111111" style="background:#111111" title="검정"></button>
          <input type="range" id="bWidth" min="1" max="24" value="4" title="굵기" aria-label="굵기">
          <span class="sep"></span>
          <button id="bUndo" title="되돌리기 (Ctrl+Z)">↶</button><button id="bRedo" title="다시하기 (Ctrl+Y)">↷</button><button id="bClear" title="이 페이지 판서 지우기">🧹</button>
          <span style="flex:1"></span>
          <button id="bClose" title="보드 닫기 (B / Esc)">✕ 닫기</button>
        </div>
        <div class="bwrap" id="bWrap"><canvas id="bBg"></canvas><canvas id="bInk"></canvas><div class="laser" id="bLaser"></div><div class="bhint" id="bHint"></div></div>
        <input type="file" id="bFilePdf" accept="application/pdf" hidden><input type="file" id="bFileImg" accept="image/*" hidden><input type="file" id="bFileProj" accept="application/json" hidden>
      </div>
      <div class="stage-foot"><span>응답 <b class="num" id="respCount">0</b></span><span id="clock" class="tl"></span></div>
    </div>
  </section>

  <section id="viewStu" class="stu hidden">
    <div class="banner hidden" id="stuBanner" role="status" aria-live="polite"></div>
    <div class="card" id="stuCard"></div>
    <p class="center small">세션 <b id="stuCode"></b> · 응답은 익명으로 집계됩니다</p>
  </section>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LABELS = {understand:'이해도 체크', vote:'찬성 / 반대', cloud:'워드 클라우드', break:'쉬는 시간', lab:'실습 안내', notice:'공지', idle:'대기'};
const DEFAULT_TEXT = {
  understand:'지금까지 내용, 어느 정도 이해되셨나요?',
  vote:'이 방식에 찬성하시나요?',
  cloud:'오늘 배운 내용 중 가장 기억에 남는 키워드를 한 단어로!',
  break:'{n}분 후에 다시 시작합니다',

const state = {role:null, code:null, room:{mode:'idle', round:'r0', text:'', hidden:false}, texts:{...DEFAULT_TEXT}, responses:[], demo:false, breakMin:10, unsub:[], loaded:false, lastRound:null, lastMode:null, sentWords:[]};

function toast(m,c){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#D65A4A;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw'; document.body.appendChild(t);} t.style.background=c||'#D65A4A'; t.textContent=m; t.hidden=false; clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,5000); }
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');

// ================= DATA ADAPTERS =================
// 공통 인터페이스: connect() -> bool, getRoom, setRoom, onRoom, putResponse, onResponses, heartbeat, onMembers
const ArtifactAdapter = {
  db:null,
  async connect(){ this.db = window.claude?.use ? await window.claude.use('db') : null; return !!this.db; },
  getRoom:async c=>{ const s=await ArtifactAdapter.db.doc('rooms/'+c).get(); return s.exists? s.data(): null; },
  setRoom:(c,d)=>ArtifactAdapter.db.doc('rooms/'+c).set(d),
  onRoom:(c,cb)=>ArtifactAdapter.db.doc('rooms/'+c).onSnapshot(s=>{ if(s.exists) cb(s.data()); }),
  putResponse:(c,id,r)=>ArtifactAdapter.db.doc(`rooms/${c}/responses/${id}`).set(r),
  onResponses:(c,cb)=>ArtifactAdapter.db.collection(`rooms/${c}/responses`).onSnapshot(s=>cb(s.docs.map(d=>d.data()))),
  heartbeat:(c,dev)=>ArtifactAdapter.db.doc(`rooms/${c}/members/${dev}`).set({ts:Date.now()}),
  onMembers:(c,cb)=>ArtifactAdapter.db.collection(`rooms/${c}/members`).onSnapshot(s=>cb(s.docs.map(d=>d.data().ts||0))),
};
const SupabaseAdapter = {
  sb:null,
  // supabase 쿼리는 Promise가 아니라 thenable이므로 항상 await 후 {error}를 검사해 예외로 바꿔준다
  async q(b){ const {data,error}=await b; if(error) throw new Error(error.message); return data; },
  async connect(){ const cfg=window.CP_CONFIG; if(!cfg?.supabaseUrl) throw new Error('CP_CONFIG 없음'); if(!window.supabase) throw new Error('supabase-js 라이브러리 로드 실패 (CDN 차단?)'); this.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey); try{ await this.q(this.sb.from('rooms').select('code').limit(1)); }catch(e){ throw new Error('DB 접근 실패: '+e.message); } return true; },
  async getRoom(c){ const d=await this.q(this.sb.from('rooms').select('data').eq('code',c).maybeSingle()); return d?.data||null; },
  async setRoom(c,d){ await this.q(this.sb.from('rooms').upsert({code:c,data:d,updated_at:new Date().toISOString()})); },
  onRoom(c,cb){ const ch=this.sb.channel('room-'+c).on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'code=eq.'+c},p=>{ if(p.new?.data) cb(p.new.data); }).subscribe(); this.getRoom(c).then(d=>d&&cb(d)).catch(console.warn); return ()=>this.sb.removeChannel(ch); },
  async putResponse(c,id,r){ await this.q(this.sb.from('responses').upsert({id,code:c,round:r.round,type:r.type,value:String(r.value),dev:r.dev,ts:r.ts})); },
  onResponses(c,cb){ const fetch=()=>this.q(this.sb.from('responses').select('round,type,value,dev,ts').eq('code',c)).then(d=>cb(d||[])).catch(console.warn); const ch=this.sb.channel('resp-'+c).on('postgres_changes',{event:'*',schema:'public',table:'responses',filter:'code=eq.'+c},fetch).subscribe(); fetch(); const t=setInterval(fetch,15000); return ()=>{ clearInterval(t); this.sb.removeChannel(ch); }; },
  async heartbeat(c,dev){ await this.q(this.sb.from('members').upsert({code:c,dev,ts:Date.now()})); },
  onMembers(c,cb){ const fetch=()=>this.q(this.sb.from('members').select('ts').eq('code',c)).then(d=>cb((d||[]).map(m=>m.ts))).catch(console.warn); const ch=this.sb.channel('mem-'+c).on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'code=eq.'+c},fetch).subscribe(); fetch(); const t=setInterval(fetch,30000); return ()=>{ clearInterval(t); this.sb.removeChannel(ch); }; },
};
let A=null; // active adapter
async function connect(){
  if(A!==null) return !!A;
  const cand = window.CP_CONFIG?.supabaseUrl ? SupabaseAdapter : ArtifactAdapter;
  let ok=false, why=''; try{ ok=await cand.connect(); if(!ok) why='실시간 DB 사용 불가 (공유·로그인 상태 확인)'; }catch(e){ console.warn(e); why=e.message||String(e); }
  A = ok? cand : false; state.demo=!ok;
  const t=$('#connTag'); t.title = ok? '' : ('DEMO 원인: '+why); t.onclick = ok? null : ()=>alert('DEMO 모드 원인:\n'+why);
  if(state.role==='student'){ t.textContent= ok?'● 연결됨':'● 데모'; t.className='tag'; }
  else { t.textContent= ok?'LIVE · 실시간 공유':'DEMO · 이 화면에서만 동작'; t.className='tag '+(ok?'live':'demo'); }
  return ok;
}

  else { show('viewLanding'); $('#switchLink').textContent=''; }
}
function genCode(){ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; return [...Array(4)].map(()=>a[Math.floor(Math.random()*a.length)]).join(''); }

$('#btnHost').onclick=()=>{ location.hash='host'; };

function roomPatch(patch){
  state.room={...state.room,...patch,updatedAt:Date.now()};
  renderAll();
  if(A){ Promise.resolve().then(()=>A.setRoom(state.code,state.room)).catch(e=>{ console.warn(e); toast('저장 실패: '+e.message); }); }
}
async function sendResponse(type,value){
  const r={round:state.room.round,type,value,dev:deviceId,ts:Date.now()};
  if(A){ const id=(type==='cloud'?'c'+Date.now().toString(36)+'_':state.room.round+'_')+deviceId; try{ await A.putResponse(state.code,id,r); }catch(e){ console.warn(e); toast('전송 실패: '+e.message); } }
  else { if(type!=='cloud') state.responses=state.responses.filter(x=>!(x.round===r.round&&x.type===type&&x.dev===deviceId)); state.responses.push(r); }
  if(type==='cloud'){ state.sentWords.unshift(String(value)); state.sentWords=state.sentWords.slice(0,6); }
  renderAll();
}
function subscribe(){
  state.unsub.forEach(u=>u()); state.unsub=[];
  if(!A) return;
  state.unsub.push(A.onRoom(state.code,d=>{ state.room={...state.room,...d}; state.loaded=true; renderAll(); }));
  state.unsub.push(A.onResponses(state.code,list=>{ state.responses=list; renderAll(); }));
  if(state.role==='host') state.unsub.push(A.onMembers(state.code,tss=>{ const cut=Date.now()-120000; $('#members').textContent=tss.filter(t=>t>cut).length; }));
}
async function start(role,code){
  state.role=role; state.code=code; state.responses=[]; state.loaded=false;
  await connect();
  if(role==='host'){
    try{localStorage.setItem('cping_host',code)}catch{}
    show('viewHost');
    $('#codeText').textContent=$('#codeText2').textContent=code;
    $('#switchLink').textContent='학생 화면 미리보기 ↗'; $('#switchLink').href='#join='+code; $('#switchLink').target='_blank';
    if(A){ try{ const d=await A.getRoom(code); if(d) state.room={...state.room,...d}; else await A.setRoom(code,{...state.room,createdAt:Date.now()}); }catch(e){ console.warn(e); toast('세션 불러오기 실패: '+e.message); } state.loaded=true; }
    else seedDemo();
    loadTextFor(state.room.mode);
  } else {
    show('viewStu'); $('#stuCode').textContent=code; $('#switchLink').textContent='';
    if(A){
      $('#stuCard').innerHTML='<p class="center">세션 연결 중…</p>';
      let d=null; try{ d=await A.getRoom(code); }catch(e){ $('#stuCard').innerHTML=`<p class="q">연결 오류</p><p class="small">${esc(e.message)}</p><button class="primary" onclick="location.reload()">다시 시도</button>`; return; }
      if(!d){ $('#stuCard').innerHTML=`<p class="q">코드 <b>${esc(code)}</b> 세션을 찾을 수 없어요</p><p class="small">강사가 아직 세션을 열지 않았거나 코드가 다를 수 있어요. 화면의 코드를 다시 확인해 주세요.</p><div class="row" style="margin-top:12px"><input id="reCode" aria-label="참여 코드" maxlength="4" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px"><button class="primary" id="reJoin" style="min-width:80px">다시 참여</button></div>`; $('#reJoin').onclick=()=>{ const c=$('#reCode').value.trim().toUpperCase(); if(c.length===4) location.hash='join='+c; }; return; }
      state.room={...state.room,...d}; state.loaded=true;
      const hb=()=>A.heartbeat(code,deviceId).catch(()=>{}); hb(); state.unsub.push((()=>{ const t=setInterval(hb,60000); return ()=>clearInterval(t); })());
    } else { state.loaded=true; }
    state.lastRound=state.room.round; state.lastMode=state.room.mode;
  }
  subscribe(); renderAll();
}
function seedDemo(){

// ================= HOST CONTROLS =================
function textFor(mode){ return (state.texts[mode]||DEFAULT_TEXT[mode]||'').replace('{n}',state.breakMin); }
function loadTextFor(mode){ $('#qText').value=textFor(mode); $('#qTextMode').textContent='· '+(LABELS[mode]||''); }
$$('[data-mode]').forEach(b=>b.onclick=()=>activate(b.dataset.mode));
function activate(mode){
  const same = state.room.mode===mode;
  const patch={mode, text:textFor(mode)};
  if(['understand','vote','cloud'].includes(mode) && !same) patch.round = state.demo?'demo':'r'+Date.now().toString(36);
  if(mode==='break' && !same) patch.breakEnd = Date.now()+state.breakMin*60000;
  loadTextFor(mode);
  roomPatch(patch);
}
$$('[data-min]').forEach(b=>b.onclick=()=>{ state.breakMin=+b.dataset.min; $$('[data-min]').forEach(x=>x.classList.toggle('active',x===b)); if(state.room.mode==='break'){ loadTextFor('break'); roomPatch({breakEnd:Date.now()+state.breakMin*60000,text:textFor('break')}); } else activate('break'); });
$('#btnApplyText').onclick=()=>{ const t=$('#qText').value.trim(); state.texts[state.room.mode]=t||DEFAULT_TEXT[state.room.mode]; roomPatch({text:t||textFor(state.room.mode)}); };
$('#btnReveal').onclick=()=>roomPatch({hidden:!state.room.hidden});

$('#btnCopy').onclick=async()=>{ const url=location.origin+location.pathname+'#join='+state.code; try{ await navigator.clipboard.writeText(url); $('#btnCopy').textContent='✓ 복사됨'; }catch{ prompt('참여 링크', url); } setTimeout(()=>$('#btnCopy').textContent='🔗 참여 링크 복사',1500); };

document.addEventListener('keydown',e=>{
  if(state.role!=='host'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(Board.on){ const kk=e.key.toLowerCase(); if((e.ctrlKey||e.metaKey)&&kk==='z'){ e.preventDefault(); e.shiftKey?Board.redo():Board.undo(); return; } if((e.ctrlKey||e.metaKey)&&kk==='y'){ e.preventDefault(); Board.redo(); return; } if(e.key==='ArrowRight'||e.key==='PageDown'){ Board.go(1); return; } if(e.key==='ArrowLeft'||e.key==='PageUp'){ Board.go(-1); return; } if(e.key==='Escape'){ Board.toggle(false); return; } }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const map={'1':'understand','2':'vote','3':'cloud','4':'break','5':'lab','6':'notice','0':'idle'};
  if(map[e.key]) activate(map[e.key]);
  const k=e.key.toLowerCase();
  if(k==='b'||k==='p') $('#btnBoard').click(); if(k==='f') $('#btnFull').click(); if(k==='m') $('#btnBgm').click(); if(k==='r') $('#btnReveal').click();
});

// ================= RENDER =================
const cur=()=>state.responses.filter(r=>r.round===state.room.round&&r.type===state.room.mode);
function renderAll(){
  $$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.room.mode));
  $('#btnReveal').innerHTML=(state.room.hidden?'👁 결과 공개':'👁 결과 숨기기')+'<span class="k">R</span>';
  $('#btnReveal').classList.toggle('active',!!state.room.hidden);
  if(state.role==='host') renderStage(); else if(state.role==='student') renderStudent();

function bars(items,total){
  return `<div class="bars">${items.map(i=>{ const pct=total?Math.round(i.n/total*100):0;
    return `<div class="bar"><div class="n num">${i.n} <small>${pct}%</small></div><div class="fill" style="height:${Math.max(2,pct)}%;background:${i.c}"></div><div class="t">${i.t}</div></div>`; }).join('')}</div>`;
}
function renderStage(){
  const m=state.room.mode, rs=cur(), body=$('#stageBody');
  $('#stageMode').textContent=LABELS[m]||m; $('#respCount').textContent=['understand','vote','cloud'].includes(m)?rs.length:'–';
  const q=`<h2 class="stage-q">${esc(state.room.text)}</h2>`;
  const hiddenNote=`<p class="hidden-results">결과는 잠시 후 공개됩니다 · 응답 <b class="num" style="color:var(--stage-ink);font-size:40px">${rs.length}</b></p>`;
  if(m==='understand'){ const c=v=>rs.filter(r=>+r.value===v).length;
    body.innerHTML=q+(state.room.hidden?hiddenNote:bars([{t:'잘 이해됨',n:c(1),c:'var(--good)'},{t:'애매함',n:c(2),c:'var(--mid)'},{t:'어려움',n:c(3),c:'var(--bad)'}],rs.length));
  } else if(m==='vote'){ const c=v=>rs.filter(r=>r.value===v).length;
    body.innerHTML=q+(state.room.hidden?hiddenNote:bars([{t:'찬성',n:c('yes'),c:'var(--vote-yes)'},{t:'반대',n:c('no'),c:'var(--vote-no)'},{t:'기권',n:c('abstain'),c:'var(--vote-ab)'}],rs.length));
  } else if(m==='cloud'){
    body.innerHTML=`<h2 class="stage-q" style="font-size:22px;color:var(--stage-dim)">${esc(state.room.text)}</h2>`+(state.room.hidden?hiddenNote:'<div class="cloud" id="cloud"></div>');
    if(!state.room.hidden) requestAnimationFrame(()=>drawCloud(rs.map(r=>String(r.value))));
  } else if(m==='break'){
    body.innerHTML=`<p class="lbl" style="color:var(--stage-dim);font-size:16px">쉬는 시간</p><p class="stage-big num countdown">--:--</p><p style="font-size:24px;color:var(--stage-dim);margin:0">${esc(state.room.text)}</p>`;
  } else if(m==='lab'||m==='notice'){

    if(window.QRCode){ try{ new QRCode($('#idleQr'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M}); }catch{ $('#idleQr').textContent='QR 생성 불가'; } }
    else $('#idleQr').innerHTML='<span style="color:#333;font-size:13px;text-align:center;padding:10px">QR을 만들 수 없어요<br>채팅에 참여 링크를 붙여 주세요</span>';
  }

function renderStudent(){
  if(!state.loaded) return;
  const m=state.room.mode, card=$('#stuCard'), rs=cur();
  // 라운드/모드 변경 배너
  if(state.lastMode!==null && (state.lastMode!==m || state.lastRound!==state.room.round)){
    const msg = ['understand','vote','cloud'].includes(m)? '새 질문이 열렸어요' : (m==='break'?'쉬는 시간이에요':'강사가 화면을 바꿨어요');

  }

  const btn=(v,t)=>`<button data-v="${v}" class="${mine&&String(mine.value)===String(v)?'sent':''}">${t}</button>`;
  const status=(sent)=>`<p class="status" role="status" aria-live="polite">${sent?('응답이 전송됐어요 ✓ 바꾸려면 다시 선택하세요'+(state.room.hidden?' · 결과는 강사가 공개합니다':'')):'하나를 선택하세요'}</p>`;
  if(m==='understand'){
    card.innerHTML=`<p class="q">${esc(state.room.text)}</p><div class="choice">${btn(1,'😀 잘 이해됨')}${btn(2,'🤔 애매함')}${btn(3,'😵 어려움')}</div>${status(!!mine)}`;
  } else if(m==='vote'){

  } else if(m==='cloud'){

    const send=()=>{ const v=$('#cloudIn').value.trim(); if(!v) return; sendResponse('cloud',v); $('#cloudIn').value=''; $('#cloudIn').focus(); };

  } else if(m==='lab'||m==='notice'){

function drawCloud(words){
  const el=$('#cloud'); if(!el) return;
  const freq={}, disp={};
  words.forEach(w=>{ const k=w.trim().toLowerCase(); if(!k) return; freq[k]=(freq[k]||0)+1; disp[k]=disp[k]||{}; disp[k][w.trim()]=(disp[k][w.trim()]||0)+1; });
  const list=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,40);
  const max=list[0]?.[1]||1, W=el.clientWidth||700, H=el.clientHeight||300;
  const pal=['#FFD166','#4CC9F0','#F4F7FA','#80ED99','#F7A072','#B5A4F5'];
  const placed=[]; el.innerHTML='';
  list.forEach(([k,n],i)=>{
    const label=Object.entries(disp[k]).sort((a,b)=>b[1]-a[1])[0][0];
    const s=document.createElement('span'); s.textContent=label; s.style.color=pal[i%pal.length]; s.title=n+'회'; el.appendChild(s);
    let size=22+(n/max)*50, ok=false, x=W/2, y=H/2;
    for(let attempt=0; attempt<3 && !ok; attempt++, size*=0.75){
      s.style.fontSize=size+'px'; const bw=s.offsetWidth+8, bh=s.offsetHeight+4; let a=0,r=0;
      for(let t=0;t<700;t++){ x=W/2+r*Math.cos(a); y=H/2+r*Math.sin(a)*0.6; const box={l:x-bw/2,t:y-bh/2,r:x+bw/2,b:y+bh/2};
        if(box.l>=0&&box.t>=0&&box.r<=W&&box.b<=H&&!placed.some(p=>!(box.r<p.l||box.l>p.r||box.b<p.t||box.t>p.b))){ ok=true; placed.push(box); break; } a+=0.35; r+=1.6; }
    }
    if(!ok){ s.remove(); return; } s.style.left=x+'px'; s.style.top=y+'px';
  });
  if(!list.length) el.innerHTML='<p style="color:var(--stage-dim);text-align:center;padding-top:100px;font-size:22px">단어가 들어오면 여기에 나타납니다</p>';
}

// countdown + clock (+ break end handling)
let chimed=null;
function tick(){
  const cds=$$('.countdown');
  if(cds.length&&state.room.mode==='break'&&state.room.breakEnd){
    const d=Math.max(0,state.room.breakEnd-Date.now());
    const txt = d===0? '시작합니다' : String(Math.floor(d/60000)).padStart(2,'0')+':'+String(Math.floor(d%60000/1000)).padStart(2,'0');
    cds.forEach(c=>c.textContent=txt);
    if(state.role==='student' && d>0 && d<=60000 && !$('#stuBanner').textContent.includes('1분')){ const b=$('#stuBanner'); b.textContent='1분 후 강의가 다시 시작돼요'; b.classList.remove('hidden'); }
    if(state.role==='host' && d===0 && chimed!==state.room.breakEnd){ chimed=state.room.breakEnd; chime(); setTimeout(()=>{ if(state.room.mode==='break') activate('idle'); },3000); }
  }
  const k=$('#clock'); if(k) k.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

// ================= 보드 (PDF·칠판 판서, 강사 화면 전용) =================
const Board = (() => {
  const wrap=$('#bWrap'), bg=$('#bBg'), inkC=$('#bInk'), bctx=bg.getContext('2d'), ictx=inkC.getContext('2d'), laser=$('#bLaser'), hint=$('#bHint');
  const B={on:false, pages:[], cur:0, tool:'pen', color:'#FFD166', width:4, pdf:null, pdfBytes:null, cache:{}, drawing:null, dirty:false};
  const BG={green:'#2F5D3A', black:'#101418', white:'#FFFFFF', grid:'#FFFFFF'};
  const newPage=(bgType,extra={})=>({bg:bgType, strokes:[], redo:[], ...extra});
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ---- geometry: 컨텐츠 사각형(페이지 비율 유지) 안에서 0..1 정규화 좌표 사용
  function pageAspect(p){ if(p.bg==='pdf'&&p.pdfAspect) return p.pdfAspect; if(p.bg==='image'&&p.imgAspect) return p.imgAspect; return 16/9; }
  function rect(){ const W=wrap.clientWidth, H=wrap.clientHeight, p=B.pages[B.cur]; if(!p) return {x:0,y:0,w:W,h:H}; const a=pageAspect(p); let w=W,h=W/a; if(h>H){ h=H; w=H*a; } return {x:(W-w)/2,y:(H-h)/2,w,h}; }
  const norm=(e)=>{ const r=rect(), b=wrap.getBoundingClientRect(); return [(e.clientX-b.left-r.x)/r.w,(e.clientY-b.top-r.y)/r.h]; };

  // ---- rendering
  async function drawBg(){
    const W=wrap.clientWidth, H=wrap.clientHeight; bg.width=inkC.width=W; bg.height=inkC.height=H;
    bctx.fillStyle='#1B2430'; bctx.fillRect(0,0,W,H);
    const p=B.pages[B.cur]; hint.textContent=''; if(!p){ hint.innerHTML='📄 파일 ▾ 에서 PDF를 열거나, ➕ 페이지 ▾ 에서 칠판을 추가하세요'; drawInk(); return; }
    const r=rect();
    if(p.bg==='pdf'&&B.pdf){
      const key=p.pdfPage+'@'+Math.round(r.w);
      if(!B.cache[key]){ const page=await B.pdf.getPage(p.pdfPage); const vp0=page.getViewport({scale:1}); const scale=Math.min(3,(r.w*devicePixelRatio)/vp0.width); const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; B.cache[key]=c; if(Object.keys(B.cache).length>12) delete B.cache[Object.keys(B.cache)[0]]; }
      if(B.pages[B.cur]!==p) return; bctx.drawImage(B.cache[key],r.x,r.y,r.w,r.h);
    } else if(p.bg==='image'&&p.img){
      if(!p._el){ p._el=new Image(); p._el.src=p.img; await new Promise(res=>p._el.onload=res); } bctx.drawImage(p._el,r.x,r.y,r.w,r.h);
    } else {
      bctx.fillStyle=BG[p.bg]||'#fff'; bctx.fillRect(r.x,r.y,r.w,r.h);
      if(p.bg==='grid'){ bctx.strokeStyle='rgba(0,0,0,.12)'; bctx.lineWidth=1; const step=r.w/32; for(let x=r.x;x<=r.x+r.w+1;x+=step){ bctx.beginPath(); bctx.moveTo(x,r.y); bctx.lineTo(x,r.y+r.h); bctx.stroke(); } for(let y=r.y;y<=r.y+r.h+1;y+=step){ bctx.beginPath(); bctx.moveTo(r.x,y); bctx.lineTo(r.x+r.w,y); bctx.stroke(); } }
    }
    drawInk();
  }
  function drawStroke(ctx,s,r){
    const px=([x,y])=>[r.x+x*r.w, r.y+y*r.h]; const lw=s.width*r.w/1000;
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineWidth=lw;
    if(s.tool==='hl'){ ctx.globalAlpha=.35; ctx.lineWidth=lw*3; }
    if(s.tool==='pen'||s.tool==='hl'){ ctx.beginPath(); s.points.forEach((p,i)=>{ const [x,y]=px(p); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); if(s.points.length===1){ const [x,y]=px(s.points[0]); ctx.arc(x,y,lw/2,0,7); ctx.fill(); } ctx.stroke(); }
    else if(s.tool==='line'){ const [a,b]=[px(s.points[0]),px(s.points[1])]; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); }
    else if(s.tool==='rect'){ const [a,b]=[px(s.points[0]),px(s.points[1])]; ctx.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])); }
    else if(s.tool==='ellipse'){ const [a,b]=[px(s.points[0]),px(s.points[1])]; ctx.beginPath(); ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,7); ctx.stroke(); }
    else if(s.tool==='text'){ const [x,y]=px(s.points[0]); ctx.font=`600 ${Math.max(12,s.width*r.w/120)}px "IBM Plex Sans KR","Noto Sans KR",sans-serif`; ctx.textBaseline='top'; s.text.split('\n').forEach((line,i)=>ctx.fillText(line,x,y+i*s.width*r.w/100)); }
    ctx.restore();
  }
  function drawInk(){ ictx.clearRect(0,0,inkC.width,inkC.height); const p=B.pages[B.cur]; if(!p) return; const r=rect(); p.strokes.forEach(s=>drawStroke(ictx,s,r)); if(B.drawing) drawStroke(ictx,B.drawing,r); }
  function refresh(){ $('#bPg').textContent=B.pages.length?`${B.cur+1} / ${B.pages.length}`:'0 / 0'; drawBg(); }

  // ---- pointer
  inkC.addEventListener('pointerdown',e=>{
    if(!B.pages.length){ addPage('green'); }
    const [x,y]=norm(e); const p=B.pages[B.cur];
    if(B.tool==='laser') return;
    if(B.tool==='eraser'){ eraseAt(x,y); B.drawing={tool:'eraser'}; return; }
    if(B.tool==='text'){ const t=prompt('표시할 글자를 입력하세요'); if(t&&t.trim()){ commit({tool:'text',color:B.color,width:B.width*3,points:[[x,y]],text:t.trim()}); } return; }
    B.drawing={tool:B.tool,color:B.color,width:B.width,points:[[x,y],[x,y]]}; inkC.setPointerCapture(e.pointerId);
  });
  inkC.addEventListener('pointermove',e=>{
    const [x,y]=norm(e);
    if(B.tool==='laser'){ const b=wrap.getBoundingClientRect(); laser.style.display='block'; laser.style.left=(e.clientX-b.left)+'px'; laser.style.top=(e.clientY-b.top)+'px'; return; }
    if(!B.drawing) return;
    if(B.drawing.tool==='eraser'){ eraseAt(x,y); return; }
    if(B.drawing.tool==='pen'||B.drawing.tool==='hl'){ const w=B.drawing.points.at(-1); if(Math.hypot(w[0]-x,w[1]-y)>0.0015) B.drawing.points.push([x,y]); } else B.drawing.points[1]=[x,y];
    drawInk();
  });
  const end=()=>{ if(B.drawing&&B.drawing.tool!=='eraser') commit(B.drawing); B.drawing=null; drawInk(); };
  inkC.addEventListener('pointerup',end); inkC.addEventListener('pointercancel',end);
  inkC.addEventListener('pointerleave',()=>{ laser.style.display='none'; });
  function commit(s){ const p=B.pages[B.cur]; p.strokes.push(s); p.redo=[]; B.dirty=true; drawInk(); }
  function eraseAt(x,y){ const p=B.pages[B.cur]; const R=0.02; const before=p.strokes.length; p.strokes=p.strokes.filter(s=>!s.points.some(([px,py])=>Math.hypot(px-x,py-y)<R) && !(s.tool==='rect'||s.tool==='ellipse'||s.tool==='line' ? inBox(s,x,y):false)); if(p.strokes.length!==before){ B.dirty=true; drawInk(); } }
  function inBox(s,x,y){ const [a,b]=s.points; const l=Math.min(a[0],b[0]),r=Math.max(a[0],b[0]),t=Math.min(a[1],b[1]),bt=Math.max(a[1],b[1]); const m=0.015; const near=(v,lo,hi)=>v>=lo-m&&v<=hi+m; return (near(x,l,r)&&(Math.abs(y-t)<m||Math.abs(y-bt)<m))||(near(y,t,bt)&&(Math.abs(x-l)<m||Math.abs(x-r)<m)); }

  // ---- pages
  function addPage(bgType){ B.pages.splice(B.cur+1,0,newPage(bgType)); B.cur=Math.min(B.cur+1,B.pages.length-1); B.dirty=true; refresh(); }
  function go(d){ if(!B.pages.length) return; B.cur=Math.max(0,Math.min(B.pages.length-1,B.cur+d)); refresh(); }
  function undo(){ const p=B.pages[B.cur]; if(p&&p.strokes.length){ p.redo.push(p.strokes.pop()); B.dirty=true; drawInk(); } }
  function redo(){ const p=B.pages[B.cur]; if(p&&p.redo.length){ p.strokes.push(p.redo.pop()); B.dirty=true; drawInk(); } }

  // ---- files
  async function openPdf(bytes,name){
    if(!window.pdfjsLib){ toast('PDF 라이브러리를 불러오지 못했습니다'); return; }
    B.pdf=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise; B.pdfBytes=bytes; B.pdfName=name||'document.pdf'; B.cache={};
    const first=await B.pdf.getPage(1); const vp=first.getViewport({scale:1});
    const pages=[]; for(let i=1;i<=B.pdf.numPages;i++){ const pg=i===1?first:await B.pdf.getPage(i); const v=i===1?vp:pg.getViewport({scale:1}); pages.push(newPage('pdf',{pdfPage:i,pdfAspect:v.width/v.height})); }
    B.pages=pages.concat(B.pages.filter(p=>p.bg!=='pdf')); B.cur=0; B.dirty=true; refresh(); toast(`PDF ${B.pdf.numPages}페이지를 열었습니다`,'#2E9E6B');
  }
  $('#bOpenPdf').onclick=()=>$('#bFilePdf').click();
  $('#bFilePdf').onchange=async e=>{ const f=e.target.files[0]; if(f) openPdf(new Uint8Array(await f.arrayBuffer()),f.name); e.target.value=''; };
  $('#bOpenImg').onclick=()=>$('#bFileImg').click();
  $('#bFileImg').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ B.pages.splice(B.cur+1,0,newPage('image',{img:rd.result,imgAspect:im.width/im.height})); B.cur=B.pages.length===1?0:B.cur+1; B.dirty=true; refresh(); }; im.src=rd.result; }; rd.readAsDataURL(f); e.target.value=''; };
  function composed(idx){ // 배경+판서 합성 PNG (현재 캔버스 크기 기준)
    const c=document.createElement('canvas'); c.width=bg.width; c.height=bg.height; const x=c.getContext('2d'); x.drawImage(bg,0,0); x.drawImage(inkC,0,0); return c; }
  function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
  const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').replace(/(\d{8})(\d{4})/,'$1-$2');
  $('#bSavePng').onclick=()=>{ if(!B.pages.length) return; composed().toBlob(b=>download(b,`classping-board-${stamp()}-p${B.cur+1}.png`)); };
  $('#bSaveZip').onclick=async()=>{ if(!B.pages.length||!window.JSZip){ toast('저장할 페이지가 없거나 ZIP 라이브러리가 없습니다'); return; } const zip=new JSZip(); const keep=B.cur; for(let i=0;i<B.pages.length;i++){ B.cur=i; await drawBg(); const blob=await new Promise(r=>composed().toBlob(r)); zip.file(`page-${String(i+1).padStart(2,'0')}.png`,blob); } B.cur=keep; refresh(); download(await zip.generateAsync({type:'blob'}),`classping-board-${stamp()}.zip`); };
  $('#bSaveProj').onclick=()=>{ const data={v:1,cur:B.cur,pdfName:B.pdfName||null,pdf:B.pdfBytes?b64(B.pdfBytes):null,pages:B.pages.map(({_el,...p})=>p)}; download(new Blob([JSON.stringify(data)],{type:'application/json'}),`classping-board-${stamp()}.json`); };
  $('#bOpenProj').onclick=()=>$('#bFileProj').click();
  $('#bFileProj').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ await loadProj(JSON.parse(await f.text())); toast('프로젝트를 불러왔습니다','#2E9E6B'); }catch(err){ toast('프로젝트 파일을 읽을 수 없습니다'); } e.target.value=''; };
  async function loadProj(d){ B.pages=(d.pages||[]).map(p=>({...p,redo:p.redo||[]})); B.cur=Math.min(d.cur||0,Math.max(0,B.pages.length-1)); B.pdf=null; B.pdfBytes=null; B.cache={}; if(d.pdf){ B.pdfBytes=unb64(d.pdf); B.pdfName=d.pdfName; if(window.pdfjsLib) B.pdf=await pdfjsLib.getDocument({data:B.pdfBytes.slice(0)}).promise; } B.dirty=true; refresh(); }
  const b64=u8=>{ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  $('#bNew').onclick=()=>{ if(!confirm('모든 페이지와 판서를 지우고 새로 시작할까요?')) return; B.pages=[]; B.cur=0; B.pdf=null; B.pdfBytes=null; B.cache={}; B.dirty=true; refresh(); idbSet(null); };
  $('#bDelPage').onclick=()=>{ if(!B.pages.length) return; if(!confirm(`페이지 ${B.cur+1}을(를) 삭제할까요?`)) return; B.pages.splice(B.cur,1); B.cur=Math.max(0,Math.min(B.cur,B.pages.length-1)); B.dirty=true; refresh(); };
  $('#bClear').onclick=()=>{ const p=B.pages[B.cur]; if(p&&p.strokes.length){ p.redo=p.strokes.slice(); p.strokes=[]; B.dirty=true; drawInk(); } };

  // ---- toolbar
  $$('#board [data-tool]').forEach(b=>b.onclick=()=>{ B.tool=b.dataset.tool; $$('#board [data-tool]').forEach(x=>x.classList.toggle('active',x===b)); inkC.className=B.tool; laser.style.display='none'; });
  $$('#board .sw').forEach(b=>b.onclick=()=>{ B.color=b.dataset.c; $$('#board .sw').forEach(x=>x.classList.toggle('active',x===b)); });
  $('#bWidth').oninput=e=>B.width=+e.target.value;
  $$('#board [data-bg]').forEach(b=>b.onclick=()=>addPage(b.dataset.bg));
  $('#bPrev').onclick=()=>go(-1); $('#bNext').onclick=()=>go(1); $('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
  $('#bClose').onclick=()=>toggle(false);
  function toggle(force){ B.on = force===undefined? !B.on : force; $('#board').classList.toggle('on',B.on); $('#btnBoard').classList.toggle('active',B.on); if(B.on) requestAnimationFrame(refresh); }
  $('#btnBoard').onclick=()=>toggle();
  $('#btnFull').onclick=()=>{ const st=$('#stage'); if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen?.(); };
  new ResizeObserver(()=>{ if(B.on) refresh(); }).observe(wrap);

  // ---- autosave (IndexedDB) : 새로고침·탭 닫힘 대비
  function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('classping',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async function idbSet(v){ try{ const db=await idb(); const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,'board'); }catch{} }
  async function idbGet(){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get('board'); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch{ return null; } }
  setInterval(()=>{ if(!B.dirty) return; B.dirty=false; idbSet({v:1,cur:B.cur,pdfName:B.pdfName||null,pdf:B.pdfBytes||null,pages:B.pages.map(({_el,...p})=>p),ts:Date.now()}); },4000);
  (async()=>{ if(location.hash!=='#host') return; const d=await idbGet(); if(d&&d.pages?.length){ const when=new Date(d.ts).toLocaleString('ko-KR'); if(confirm(`이전 판서(${d.pages.length}페이지, ${when})가 남아 있습니다. 불러올까요?\n(취소하면 삭제됩니다)`)){ if(d.pdf){ B.pdfBytes=d.pdf; B.pdfName=d.pdfName; if(window.pdfjsLib) B.pdf=await pdfjsLib.getDocument({data:d.pdf.slice(0)}).promise; } B.pages=d.pages.map(p=>({...p,redo:p.redo||[]})); B.cur=d.cur||0; toggle(true); } else idbSet(null); } })();

  return {get on(){return B.on}, go, undo, redo, toggle};
})();

// ================= BGM (WebAudio 생성) =================
let ac=null, master=null, bgmTimer=null, bgmOn=false, preset='focus';
const PRESETS={ focus:{root:220,chords:[[0,7,12],[0,5,12],[-2,5,10],[0,7,14]],bpm:44,wave:'sine'}, rest:{root:174.6,chords:[[0,4,7],[-3,4,9],[-5,2,7],[0,4,11]],bpm:36,wave:'triangle'}, lab:{root:261.6,chords:[[0,7,12],[-5,2,7],[-7,0,5],[-3,4,9]],bpm:56,wave:'sine'} };
function ensureAc(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=+$('#vol').value; master.connect(ac.destination); } return ac.resume(); }
function note(f,t,dur,g,wave){ const o=ac.createOscillator(), e=ac.createGain(); o.type=wave||PRESETS[preset].wave; o.frequency.value=f; e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+dur*0.3); e.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(e).connect(master); o.start(t); o.stop(t+dur+0.1); }
function bgmLoop(){ const p=PRESETS[preset], beat=60/p.bpm, bar=beat*4; let t=ac.currentTime+0.05, i=0; const step=()=>{ const ch=p.chords[i%p.chords.length]; ch.forEach((semi,j)=>note(p.root*Math.pow(2,semi/12)*(j===0?0.5:1),t,bar*1.1,0.12)); note(p.root*Math.pow(2,ch[(i*2)%3]/12)*2,t+beat,beat*0.9,0.05); note(p.root*Math.pow(2,ch[(i+1)%3]/12)*2,t+beat*2.5,beat*0.9,0.04); t+=bar; i++; }; step(); step(); bgmTimer=setInterval(()=>{ while(t<ac.currentTime+bar*2) step(); },bar*500); }
async function chime(){ try{ await ensureAc(); const t=ac.currentTime; [523.25,659.25,783.99].forEach((f,i)=>note(f,t+i*0.18,0.9,0.2,'sine')); }catch{} }
$('#btnBgm').onclick=async()=>{ bgmOn=!bgmOn; $('#btnBgm').classList.toggle('active',bgmOn); if(bgmOn){ await ensureAc(); bgmLoop(); } else clearInterval(bgmTimer); };
$$('#bgmPresets button').forEach(b=>b.onclick=()=>{ preset=b.dataset.bgm; $$('#bgmPresets button').forEach(x=>x.classList.toggle('active',x===b)); if(bgmOn){ clearInterval(bgmTimer); bgmLoop(); } });
$('#vol').oninput=()=>{ if(master) master.gain.value=+$('#vol').value; };

route();
})();
</script>
